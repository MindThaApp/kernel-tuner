[FRONT_TEMP]
algo_type        virtual
trip_sensor      msm_therm
thresholds       -15000
thresholds_clr   -18000
sensors          msm_therm pa_therm0 chg_therm bms
weights          110       100       85        110
offsets          -2000     -2000     -2000     -2000
sampling         10000
math             0
sys_temp

[REPORT-FRONT-TEMP]
algo_type        monitor
sampling         300000
sensor           FRONT_TEMP
thresholds       45000
thresholds_clr   43000
actions          report
action_info      1

[BACK_TEMP]
algo_type        virtual
trip_sensor      msm_therm
thresholds       -15000
thresholds_clr   -18000
sensors          msm_therm pa_therm0 chg_therm bms
weights          110       100       85        110
offsets          -1000     -1000     -1000     -1000
sampling         10000
math             0
sys_temp

[REPORT-BACK-TEMP]
algo_type        monitor
sampling         300000
sensor           BACK_TEMP
thresholds       45000
thresholds_clr   43000
actions          report
action_info      1

[SS-BACK-BATT]
algo_type        ss
sampling         5000
sensor           BACK_TEMP
device           battery
set_point        41000
set_point_clr    38000

[SS-CHG-BATT]
algo_type        ss
sampling         5000
sensor           chg_therm
device           battery
set_point        50000
set_point_clr    44000
time_constant    0

# --- sanders-oc thermal relax (Magisk module) -------------------------------
# ORIGINAL: set_point 43000 / clr 41000 / device_max_limit 1401600
# Start throttling later (52 C instead of 43 C); same 1.4 GHz floor.
[SS-MSM-CLUSTER0]
algo_type        ss
sampling         1000
sensor           msm_therm
device           cluster0
set_point        52000
set_point_clr    49000
device_max_limit 1401600

# Extra safety step (not in the original): at 58 C allow throttling down to 1.0368 GHz.
[SS-MSM-CLUSTER0-HOT]
algo_type        ss
sampling         1000
sensor           msm_therm
device           cluster0
set_point        58000
set_point_clr    55000
device_max_limit 1036800
# ---------------------------------------------------------------------------

[SS-GPU]
algo_type        ss
sampling         250
sensors          gpu0-usr gpu1-usr
device           gpu
set_point        95000
set_point_clr    65000

[SS-POPMEM]
algo_type        ss
disable
sampling         250
sensor           pop_mem
device           cluster0
set_point        70000
set_point_clr    55000
time_constant    2

[MONITOR-CAMERA-MSM]
algo_type        monitor
sampling         1000
sensor           msm_therm
thresholds       52000 56000
thresholds_clr   47000 53000
actions          camera camera
action_info      1 2
